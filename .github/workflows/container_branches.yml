name: container-branches
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch: {}
jobs:
  container:
    uses: bradfordwagner/gh-template-lib/.github/workflows/custom.yml@c11cdace9aa576e0562b2e10e20c8ef29f811a36 # 0.2.0
    permissions:
      contents: read
      packages: write
    with:
      version: latest
