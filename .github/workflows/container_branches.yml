name: container-branches
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch: {}
jobs:
  container:
    uses: bradfordwagner/gh-template-lib/.github/workflows/custom.yml@feat/custom
    permissions:
      contents: read
      packages: write
    with:
      version: latest
