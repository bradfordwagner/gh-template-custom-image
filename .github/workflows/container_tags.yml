name: container-tags
on:
  push:
    tags:
      - '*'
jobs:
  container:
    uses: bradfordwagner/gh-template-lib/.github/workflows/custom.yml@c11cdace9aa576e0562b2e10e20c8ef29f811a36 # 0.2.0
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ github.ref_name }}
